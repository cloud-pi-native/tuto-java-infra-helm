
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: fault-injection-delay
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: plec-http-route
  faultInjection:
    delay:
      fixedDelay: 2s
    abort:
      httpStatus: 501
      percentage: 50