{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "demo-java-helm.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plec-http-route
spec:
  parentRefs:
  - name: default-gateway
    namespace: infra-envoy-gateway-system
  hostnames:
  - {{ .Values.httpRoute.host }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ $fullName }}
      port: {{ $svcPort }}
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
{{- end }}
