# Default values for demo-java-helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.apps.c6.numerique-interieur.com/mi-tuto/app-java-forge-dso-demo
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "master"

imagePullSecrets: 
  - name: "registry-pull-secret"
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  secret:
    enabled: true
  host: plec-demo.dev.numerique-interieur.com

resources: 
  limits:
    memory: "512Mi"
    cpu: "500m"  
  requests:
    memory: "512Mi"
    cpu: "100m"  

postgres:
  fullnameOverride: postgres

  auth:
    username: "userdemo"
    database: "userdemo"

  resources: 
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "512Mi"
      cpu: "100m"

  containerSecurityContext:
    containerSecurityContext:
      enabled: true
    enabled: true
    fsGroup: 99999
    podSecurityContext:
      enabled: true
    securityContext:
      enabled: true
    shmVolume:
      chmod:
        enabled: false
    volumePermissions:
      enabled: true
      securityContext:
        runAsUser: '99999' 

  podSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 99999
    runAsGroup: 99999
